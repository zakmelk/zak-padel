<div class="product">
    <div class="product-details">
        <img [src]="getImageUrl(product)" [alt]="product?.name" />
        <div class="product-info">
        <div class="name">{{ product?.name }}</div>
        <div class="description">{{ product?.description }}</div>
        <div class="category">Part Type: {{ product?.category }}</div>
        </div>
    </div>
    <div class="price">
        <div
        [ngStyle]="{'color': product.discount > 0 ? 'green' : ''}"
        [ngClass]="getDiscountClass(product)">{{ product?.price | currency:'EUR' }}
        </div>
        <div class="discount" *ngIf="product.discount > 0">
        {{ (product.price * (1-product.discount)) | currency:'EUR' }}
        </div>
        <button (click)="buyButtonClicked(product)" class="cta">Buy</button>
    </div>
</div>
